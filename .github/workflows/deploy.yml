name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - "claude/**"
  workflow_dispatch: {}
  # The daily data-fetch workflows commit with the default GITHUB_TOKEN,
  # which GitHub deliberately excludes from triggering other `push`-based
  # workflows (to prevent infinite loops) — so without this, a fresh day's
  # AI news/real estate/CRE jobs data would sit in the repo unpublished
  # until some unrelated human/Claude push happened to rebuild the site.
  # `workflow_run` is exempt from that restriction, so this chains the
  # deploy directly off each fetch job finishing.
  workflow_run:
    workflows:
      - "Fetch daily AI research news"
      - "Fetch real estate data"
      - "Fetch CRE job listings"
    types:
      - completed

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch || github.ref_name }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

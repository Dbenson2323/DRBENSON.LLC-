name: Fetch CRE job listings

# Note: GitHub only fires the `schedule` trigger for workflow files on the
# repository's default branch. Trigger by hand from the Actions tab with
# "Run workflow" any time before/without that.
#
# 12:00 UTC is 7:00 AM Central Daylight Time / 6:00 AM Central Standard
# Time — cron is always UTC and doesn't shift for US daylight saving, so
# this runs roughly 7am Chicago time in summer and 6am in winter (same
# simplification the other daily/hourly workflows in this repo use).
on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch latest CRE job listings
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
        run: npm run fetch:jobs

      - name: Commit updated data if changed
        run: |
          git config user.name "cre-jobs-bot"
          git config user.email "actions@github.com"
          if git diff --quiet -- data/cre-jobs.json; then
            echo "No changes, nothing to commit."
          else
            git add data/cre-jobs.json
            git commit -m "chore: daily CRE job listings update"
            git push
          fi
